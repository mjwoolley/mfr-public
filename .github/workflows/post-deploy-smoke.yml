# Post-deploy smoke test. Runs the (non-destructive, read-only) scripts/smoke.mjs
# against the live site right after Vercel finishes a deploy, so a broken deploy
# (down site, schema missing behind the auth gate, bad DB/R2 creds) surfaces
# without anyone remembering to run it by hand.
#
# Trigger: Vercel's GitHub app emits a `deployment_status` event when a deploy
# is ready. We smoke the *stable custom domain* (not the event's generated
# *.vercel.app URL, which can sit behind deployment protection and lacks the
# session-cookie domain the signed-in layer needs) — the event only tells us
# WHICH environment deployed:
#   - Production            → main was pushed  → millerfamilyreunions.org
#   - Preview @ staging tip → staging branch   → staging.millerfamilyreunions.org
#   - any other preview (PRs) → skipped
#
# On failure (both severities are colour-coded by smoke.mjs's exit code):
#   - PROD, any failure (code 1 or 3): open/update a labeled GitHub issue with
#     the failing checks, the run URL, the offending commit, and a manual
#     `git revert` instruction. GitHub's native failed-run email still fires too.
#   - PROD, *critical* failure (code 1 = user-facing site broken): auto-rollback
#     the production alias to the previous deployment via the `vercel` CLI, and
#     best-effort open a `revert/<sha>` PR so the fix is durable on `main`.
#     EXCEPTION: if the deploy introduced a schema migration (a new
#     apps/mfr/drizzle/*.sql), the rollback + revert-PR are SKIPPED — the
#     migration already changed the live DB, so running the previous code against
#     it would keep prod broken. The alert then asks for a manual roll-forward.
#   - Either env: the job itself goes red at the end (a visible signal on the run).
#
# For STAGING deploys this workflow ALSO resolves the PR gate directly (see the
# "Resolve staging gate" step): it sets each matching PR's `staging-verified`
# commit status to success/failure. That folds in what used to be a separate
# `staging-gate.yml` `resolve` job fed by a `workflow_run` hand-off — we already
# know the staging deploy and its smoke result here, so no cross-workflow event
# and no commit-ancestry API is needed. STAGING failures are surfaced on the PR
# via that gate status, not via an alert issue.
#
# Rollback needs three repo secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID.
#
# NOTE: `deployment_status` is a non-PR event, so GitHub always runs the copy of
# this workflow on the DEFAULT branch — it only takes effect once merged to main.
name: Post-deploy smoke

on:
  deployment_status: {}

# One run per (environment, commit); a newer deploy of the same target supersedes.
concurrency:
  group: smoke-${{ github.event.deployment.environment }}-${{ github.event.deployment.sha }}
  cancel-in-progress: true

# issues: alert issue · contents/pull-requests: auto-revert branch + PR ·
# statuses: write the `staging-verified` gate on matching PRs (staging deploys).
permissions:
  contents: write
  issues: write
  pull-requests: write
  statuses: write

jobs:
  smoke:
    # Only when Vercel reports the deploy succeeded (ignores pending/error/failure).
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Map the deploy to a target env + stable URL, or skip unrelated previews.
      - id: target
        run: |
          ENV="${{ github.event.deployment.environment }}"
          SHA="${{ github.event.deployment.sha }}"
          STAGING_TIP="$(git ls-remote origin refs/heads/staging | cut -f1)"
          if [ "$ENV" = "Production" ]; then
            echo "which=prod" >> "$GITHUB_OUTPUT"
            echo "base=https://millerfamilyreunions.org" >> "$GITHUB_OUTPUT"
          elif [ -n "$SHA" ] && [ "$SHA" = "$STAGING_TIP" ]; then
            echo "which=staging" >> "$GITHUB_OUTPUT"
            echo "base=https://staging.millerfamilyreunions.org" >> "$GITHUB_OUTPUT"
          else
            echo "which=skip" >> "$GITHUB_OUTPUT"
            echo "Deploy ($ENV @ ${SHA:0:7}) is not production or the staging-branch tip — skipping smoke." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Did THIS deploy introduce a schema migration? Vercel's build applies
      # Drizzle migrations (vercel-build → db:migrate) before the alias flips, so
      # a forward-only DROP has already hit the prod DB. Rolling the alias back to
      # the previous (pre-migration) code then runs old code against the new
      # schema → guaranteed outage. So when a new migration file landed in this
      # commit, we must NOT auto-roll-back — we page a human to roll forward.
      - name: Detect schema migration in this deploy
        id: schema
        if: steps.target.outputs.which == 'prod'
        run: |
          SHA="${{ github.event.deployment.sha }}"
          MIGRATION=false
          if git rev-parse "${SHA}~1" >/dev/null 2>&1; then
            ADDED="$(git diff --name-only --diff-filter=A "${SHA}~1" "${SHA}" -- 'apps/mfr/drizzle/*.sql')"
            [ -n "$ADDED" ] && MIGRATION=true
            echo "Added migration files: ${ADDED:-none}"
          else
            # No parent to diff against (shallow/first commit): assume a migration
            # and stay safe — never auto-roll-back what we can't inspect.
            MIGRATION=true
          fi
          echo "migration=$MIGRATION" >> "$GITHUB_OUTPUT"

      # smoke.mjs has no npm deps (global fetch only) — no install needed.
      # Each layer self-skips when its secret is absent, so partial secret setup
      # degrades to a shallower smoke rather than failing. We DON'T fail the job
      # here — the exit code is captured so later steps can alert / rollback, and
      # a dedicated final step turns the job red.
      #   exit 0 = all pass · 1 = critical (site broken) · 3 = probe/config only
      - name: Run smoke
        id: smoke
        if: steps.target.outputs.which != 'skip'
        env:
          CRON_SECRET: ${{ steps.target.outputs.which == 'prod' && secrets.CRON_SECRET_PROD || secrets.CRON_SECRET_STAGING }}
          SMOKE_SESSION_TOKEN: ${{ steps.target.outputs.which == 'prod' && secrets.SMOKE_SESSION_TOKEN_PROD || secrets.SMOKE_SESSION_TOKEN_STAGING }}
        run: |
          echo "### Smoke: ${{ steps.target.outputs.which }} → ${{ steps.target.outputs.base }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          set +e
          node scripts/smoke.mjs "${{ steps.target.outputs.base }}" 2>&1 | tee smoke.out | tee -a "$GITHUB_STEP_SUMMARY"
          code=${PIPESTATUS[0]}
          set -e
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      # ── Staging gate: resolve `staging-verified` on the matching PR(s) ────────
      # Folded in from the old `staging-gate.yml` `resolve` job. This deploy IS
      # the staging tip (the `target` step only sets which=staging when
      # SHA == staging tip) and we already know the smoke result, so we set each
      # matching PR's `staging-verified` commit status directly — no cross-workflow
      # `workflow_run` hand-off and no `compareCommits`/`getBranch` API.
      # Attribution is a local `git merge-base --is-ancestor` (checkout above is
      # fetch-depth:0, so every branch head is present).
      - name: Resolve staging gate
        if: steps.target.outputs.which == 'staging'
        uses: actions/github-script@v7
        env:
          SMOKE_CODE: ${{ steps.smoke.outputs.code }}
          DEPLOYED_SHA: ${{ github.event.deployment.sha }}
        with:
          script: |
            const { execSync } = require('child_process')
            const sha = process.env.DEPLOYED_SHA
            const ok = process.env.SMOKE_CODE === '0'
            const state = ok ? 'success' : 'failure'
            const description = ok
              ? 'Staging smoke passed'
              : 'Staging smoke failed — fix and re-deploy to staging'

            // true iff `ancestor` is an ancestor of (or equal to) `descendant`,
            // via local git. Make sure both objects are present first (checkout
            // is fetch-depth:0, but a branch head may have moved since), and only
            // treat exit code 1 ("not an ancestor") as false — any other git
            // error is thrown so the gate fails loudly instead of mis-resolving.
            const isAncestor = (ancestor, descendant) => {
              for (const c of [ancestor, descendant]) {
                try {
                  execSync(`git cat-file -e ${c}^{commit}`, { stdio: 'ignore' })
                } catch {
                  execSync(`git fetch --no-tags --depth=1 origin ${c}`, { stdio: 'ignore' })
                }
              }
              try {
                execSync(`git merge-base --is-ancestor ${ancestor} ${descendant}`, { stdio: 'ignore' })
                return true
              } catch (e) {
                if (e.status === 1) return false
                throw e
              }
            }

            // Every open PR to main whose head is contained in the smoked staging
            // commit has been exercised on staging → resolve its gate. (A
            // main→staging re-sync matches no open PR, so nothing is set.)
            const prs = await github.paginate(github.rest.pulls.list, {
              ...context.repo, state: 'open', base: 'main', per_page: 100,
            })
            let updated = 0
            for (const pr of prs) {
              if (!isAncestor(pr.head.sha, sha)) continue
              await github.rest.repos.createCommitStatus({
                ...context.repo,
                sha: pr.head.sha,
                context: 'staging-verified',
                state,
                description,
                target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              })
              core.info(`PR #${pr.number}: staging-verified → ${state}`)
              updated++
            }
            core.info(`Resolved ${updated} PR(s) from staging smoke @ ${sha.slice(0, 7)} (${state}).`)

      # ── Alert: open/update a labeled issue on ANY prod smoke failure ──────────
      - name: Alert (open/update issue)
        if: steps.target.outputs.which == 'prod' && steps.smoke.outputs.code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.payload.deployment.sha
            const short = sha.slice(0, 7)
            const code = '${{ steps.smoke.outputs.code }}'
            const critical = code === '1'
            const migration = '${{ steps.schema.outputs.migration }}' === 'true'
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const commitUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/commit/${sha}`
            const fs = require('fs')
            let smokeOut = ''
            try { smokeOut = fs.readFileSync('smoke.out', 'utf8') } catch {}
            const label = 'prod-smoke-failure'

            // Ensure the label exists (ignore "already exists").
            try {
              await github.rest.issues.createLabel({
                ...context.repo, name: label, color: 'b60205',
                description: 'Automated: production post-deploy smoke failed',
              })
            } catch (e) { /* already exists */ }

            const severity = !critical
              ? '⚠️ **Degraded** — only a probe/config check failed (e.g. `CRON_SECRET`); the site itself is up. No rollback.'
              : migration
                ? '🚨 **CRITICAL** — the site is broken, and this deploy applied a **schema migration**, so it was **NOT auto-rolled-back** (reverting code across a forward-only migration keeps prod broken). **Manual action required.**'
                : '🚨 **CRITICAL** — the user-facing site is broken; auto-rollback was attempted (see the workflow run).'
            // Migration deploys can't be fixed by reverting — the dropped/renamed
            // schema is already live, so old code stays broken. Roll forward.
            const fix = migration
              ? [
                  '**Fix forward — do NOT revert.** The migration already changed the live schema,',
                  'so the previous code is incompatible. Instead:',
                  '- Promote a healthy build (or push a fix to `main`) so the running code matches the migrated schema, or',
                  '- If the migration itself is wrong, ship a **compensating forward migration** — not a `git revert`.',
                ]
              : [
                  '**To make the fix durable** (rollback only re-points the Vercel alias — the',
                  'bad commit stays on `main`), revert it:',
                  '```sh',
                  `git revert ${sha}   # then open a PR to main`,
                  '```',
                ]
            const body = [
              `Production post-deploy smoke failed @ \`${short}\` (exit code ${code}).`,
              '',
              severity,
              '',
              '**Failing checks:**',
              '```',
              smokeOut.trim() || '(smoke output unavailable)',
              '```',
              '',
              `- Workflow run: ${runUrl}`,
              `- Offending commit: [\`${short}\`](${commitUrl})`,
              '',
              ...fix,
            ].join('\n')

            // Reuse an open incident issue if one exists; else open a new one.
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: label, per_page: 1,
            })
            if (open.length) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: open[0].number,
                body: `Recurred @ \`${short}\`:\n\n${body}`,
              })
            } else {
              await github.rest.issues.create({
                ...context.repo,
                title: `🚨 Production smoke failed @ ${short}`,
                labels: [label],
                body,
              })
            }

      # ── Rollback: re-point the prod alias on a CRITICAL failure only ─────────
      # `vercel rollback` re-points production to the previous deployment. The
      # exact flags vary by CLI version, so we print --help for the record and
      # fall back to `vercel promote` if `rollback` isn't available. Best-effort:
      # a failure here doesn't abort the alert/revert flow.
      # Skipped when this deploy carried a schema migration — see the `schema`
      # step: rolling code back across a forward-only migration breaks prod.
      - name: Rollback production (critical failure)
        if: steps.target.outputs.which == 'prod' && steps.smoke.outputs.code == '1' && steps.schema.outputs.migration != 'true'
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -x
          npm i -g vercel@latest
          echo "### Rollback: vercel CLI help (for the record)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          vercel rollback --help 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          # Previous production deployment = 2nd URL in the prod list (1st = the
          # broken current one). Fall back to a bare rollback (previous prod) if
          # we can't parse it.
          PREV="$(vercel ls --prod --token "$VERCEL_TOKEN" 2>/dev/null \
            | grep -oE 'https://[A-Za-z0-9.-]+\.vercel\.app' | sed -n '2p')"
          echo "Previous prod deployment: ${PREV:-<none parsed>}"

          if [ -n "$PREV" ]; then
            vercel rollback "$PREV" --yes --token "$VERCEL_TOKEN" \
              || vercel promote "$PREV" --yes --token "$VERCEL_TOKEN"
          else
            vercel rollback --yes --token "$VERCEL_TOKEN"
          fi
          echo "Rollback command issued." >> "$GITHUB_STEP_SUMMARY"

      # ── Auto-revert PR: make the rollback durable on `main` (best-effort) ────
      # Also skipped for schema-migration deploys — reverting the commit wouldn't
      # recreate the dropped objects (migrations are forward-only), so it can't
      # fix prod; roll forward or ship a compensating migration instead.
      - name: Open auto-revert PR (critical failure)
        if: steps.target.outputs.which == 'prod' && steps.smoke.outputs.code == '1' && steps.schema.outputs.migration != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          SHA="${{ github.event.deployment.sha }}"
          SHORT="${SHA:0:7}"
          BRANCH="revert/${SHORT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B "$BRANCH" origin/main
          # Squash-merged PRs land as a single non-merge commit → plain revert.
          git revert --no-edit "$SHA"
          git push -u origin "$BRANCH" --force-with-lease
          gh pr create --base main --head "$BRANCH" \
            --title "Revert \"$SHORT\" — production smoke failed" \
            --body "Automated revert of \`$SHA\` after its production post-deploy smoke failed (critical). The alias was rolled back live; this PR makes the revert durable on \`main\`. Review, verify on staging, and merge (or close if the deploy was fixed forward)."

      # ── Fail the job so the run goes red on any smoke failure (visible signal;
      # the staging `staging-verified` gate is resolved by the step above) ───────
      - name: Fail the job on any smoke failure
        if: steps.target.outputs.which != 'skip' && steps.smoke.outputs.code != '0'
        run: |
          echo "Smoke failed (exit code ${{ steps.smoke.outputs.code }}) — failing the job."
          exit 1
