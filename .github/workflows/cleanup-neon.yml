# Safety net for the project's branch cap, which is the scarce resource CI
# contends over. Two leaks to sweep, daily:
#
#   1. `ci-*` — CI deletes its own ephemeral branches with `if: always()`, but a
#      crashed runner can still leak one.
#   2. `preview/*` — Vercel's Neon integration forks one per PR and is supposed
#      to remove it when the PR closes. It doesn't always: three survivors from
#      already-merged/closed PRs were sitting in the project on 2026-08-07,
#      permanently eating the headroom that CI's branch-slot wait depends on.
#
# Both sweeps are name-prefixed and re-checked before deleting, so `production`,
# `main` and `dev` can never match.
name: Cleanup leaked Neon branches

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Standard cleanup or emergency dependency-preview cleanup
        type: choice
        options: [standard, dependency-previews]
        default: standard
      dry_run:
        description: In dependency-previews mode, list targets without deleting
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      # The unified Neon project ("mfr") — the one CI creates its ci-* branches
      # in (see NEON_PROJECT_ID in ci.yml). The old per-domain projects
      # (accounting/reservations/identity/portal) were consolidated into this
      # one and deleted, so their NEON_PROJECT_ID_* secrets now 404. Project ids
      # are not secrets (the API key is), so it is inlined here as in ci.yml.
      NEON_PROJECT_ID: lucky-butterfly-29223414
    steps:
      - name: Delete ci-* branches older than 24h
        if: inputs.mode != 'dependency-previews'
        run: |
          set -euo pipefail
          cutoff=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          echo "Checking project $NEON_PROJECT_ID"
          branches=$(curl -sf -H "Authorization: Bearer $NEON_API_KEY" \
            "https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/branches" |
            jq -r --arg cutoff "$cutoff" \
              '.branches[] | select(.name | startswith("ci-")) | select(.created_at < $cutoff) | .id')
          for id in $branches; do
            echo "Deleting leaked branch $id"
            curl -sf -X DELETE -H "Authorization: Bearer $NEON_API_KEY" \
              "https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/branches/$id" > /dev/null
          done

      # Vercel's Neon integration forks `preview/<head-ref>` per PR and should
      # delete it on close. When it doesn't, the branch is invisible waste. Match
      # each survivor's head ref against the repo's OPEN PRs; anything with no
      # open PR is safe to drop — a reopened PR just gets a fresh fork.
      - name: Delete preview/* branches whose PR is closed
        if: inputs.mode != 'dependency-previews'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Belt-and-braces against a race with a just-opened PR: only consider
          # branches that have already survived a full cleanup cycle.
          cutoff=$(date -u -d '6 hours ago' +%Y-%m-%dT%H:%M:%SZ)

          open_refs=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 200 \
            --json headRefName -q '.[].headRefName' | sort -u)
          echo "Open PR head refs:"; echo "${open_refs:-(none)}"

          curl -sf -H "Authorization: Bearer $NEON_API_KEY" \
            "https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/branches" |
            jq -r --arg cutoff "$cutoff" \
              '.branches[]
               | select(.creation_source == "vercel")
               | select(.name | startswith("preview/"))
               | select(.created_at < $cutoff)
               | "\(.id) \(.name)"' |
          while read -r id name; do
            ref=${name#preview/}
            # Re-assert the prefix actually stripped: a branch named exactly
            # "preview/" (or anything that slipped the jq filter) must not
            # resolve to an empty ref and get deleted on an empty match.
            if [ -z "$ref" ] || [ "$ref" = "$name" ]; then
              echo "Skipping $name — unexpected name shape"
              continue
            fi
            if printf '%s\n' "$open_refs" | grep -Fxq "$ref"; then
              echo "Keeping $name — PR for '$ref' is still open"
            else
              echo "Deleting $name ($id) — no open PR for '$ref'"
              curl -sf -X DELETE -H "Authorization: Bearer $NEON_API_KEY" \
                "https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/branches/$id" > /dev/null
            fi
          done

      - name: Reclaim dependency-PR previews only
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'dependency-previews'
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          case "$DRY_RUN" in true|false) ;; *) echo "Invalid dry_run value"; exit 1 ;; esac

          # Require a same-repository PR authored by Dependabot, not just a name prefix.
          refs=$(gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" |
            jq -c --arg repo "$GITHUB_REPOSITORY" \
              '[.[][] | select(.state == "open" and .user.login == "dependabot[bot]")
                | select(.head.repo.full_name == $repo)
                | .head.ref | select(startswith("dependabot/"))] | unique')

          api="https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID"
          list_branches() {
            local response
            response=$(curl -fsS -H "Authorization: Bearer $NEON_API_KEY" "$api/branches") || return 1
            if ! jq -e '(.branches | type == "array") and (.pagination.next == null)' <<< "$response" > /dev/null; then
              echo "Incomplete branch inventory; refusing cleanup" >&2
              return 1
            fi
            printf '%s\n' "$response"
          }
          inventory=$(list_branches)
          echo "Branch inventory before cleanup:"
          jq -r '.branches[] | [.id, .name, (.default // false), (.protected // false)] | @tsv' <<< "$inventory"

          # Never delete roots, protected/default branches, or a parent of another branch.
          filter='def eligible($refs):
            .creation_source == "vercel" and
            (.name | startswith("preview/dependabot/")) and
            .default != true and .primary != true and .protected != true and .parent_id != null and
            (.name | ltrimstr("preview/") | IN($refs[]));
            .branches as $all | $all[] | select(eligible($refs))
            | . as $candidate
            | select(any($all[]; .parent_id == $candidate.id) | not)
            | [.id, .name] | @tsv'
          candidates=$(jq -r --argjson refs "$refs" "$filter" <<< "$inventory")
          if [ -z "$candidates" ]; then
            echo "No eligible dependency-preview branches. Nothing deleted."
            exit 0
          fi

          while IFS=$'\t' read -r id name; do
            if [ "$DRY_RUN" = true ]; then
              echo "Would delete dependency preview: $name ($id)"
              continue
            fi
            # Recheck the live branch immediately before deletion.
            current=$(list_branches)
            eligible=$(jq -r --argjson refs "$refs" "$filter" <<< "$current")
            if ! grep -Fxq "$id"$'\t'"$name" <<< "$eligible"; then
              echo "Skipping changed or no-longer-eligible branch: $name ($id)"
              continue
            fi
            echo "Deleting dependency preview: $name ($id)"
            curl -fsS -X DELETE -H "Authorization: Bearer $NEON_API_KEY" \
              "$api/branches/$id" > /dev/null
          done <<< "$candidates"

          echo "Branch inventory after cleanup:"
          list_branches |
            jq -r '.branches[] | [.id, .name] | @tsv'
