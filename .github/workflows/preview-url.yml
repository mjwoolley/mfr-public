# Posts (and keeps updated) a comment on the PR with the Vercel preview URL each
# time a per-PR preview deploy succeeds — so the running preview is one click away
# from the PR.
#
# Trigger: Vercel's GitHub app emits `deployment_status` when a deploy is ready
# (same event post-deploy-smoke.yml uses). We act only on **preview** deploys
# that map to an open PR:
#   - Production            → skipped (env is "Production")
#   - staging branch        → skipped (no open PR has `staging` as its head)
#   - any PR preview        → upsert the URL comment
#
# NOTE: `deployment_status` is a non-PR event, so GitHub always runs the copy of
# this workflow on the DEFAULT branch — it only takes effect once merged to main.
name: Preview URL

on:
  deployment_status: {}

# pull-requests: write the comment · contents: read for github-script defaults.
permissions:
  pull-requests: write
  contents: read

# One run per (branch, commit); a newer deploy of the same preview supersedes.
concurrency:
  group: preview-url-${{ github.event.deployment.environment }}-${{ github.event.deployment.sha }}
  cancel-in-progress: true

jobs:
  comment:
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const dep = context.payload.deployment
            const status = context.payload.deployment_status
            // Production isn't a preview; skip it.
            if ((dep.environment || '') === 'Production') return

            const url = status.environment_url || status.target_url
            const ref = dep.ref
            if (!url || !ref) return

            // Find the open PR whose head is this branch. `staging` has no such
            // PR, so it (and any non-PR branch) is naturally skipped.
            const { data: prs } = await github.rest.pulls.list({
              ...context.repo,
              state: 'open',
              head: `${context.repo.owner}:${ref}`,
              per_page: 1,
            })
            if (!prs.length) return
            const issue_number = prs[0].number

            const marker = '<!-- preview-url -->'
            const body = [
              marker,
              `### 🔗 Preview deployed`,
              ``,
              `${url}`,
              ``,
              `<sub>Updated for \`${(dep.sha || '').slice(0, 7)}\`. Reflects the latest push to this branch.</sub>`,
            ].join('\n')

            // Upsert: reuse our marked comment if it already exists.
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number,
              per_page: 100,
            })
            const existing = comments.find((c) => (c.body || '').includes(marker))
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number,
                body,
              })
            }
            core.info(`Preview URL comment upserted on PR #${issue_number}: ${url}`)
