# CI pipeline. Every job here must pass (except `audit`/`semgrep`, which are
# advisory) before a PR can merge — branch protection requires the single
# `ci-ok` gate job, so job renames/additions only need the `needs` list below
# updated.
#
# Post single-app merge there is ONE app (apps/mfr) and ONE Neon database.
# Integration + e2e run against a single ephemeral Neon branch created off the
# unified project's production branch; the Drizzle schema is pushed onto it
# (db:push + push-only.sql) and the branch is deleted when the job ends.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The unified Neon project ("mfr"). Project ids are not secrets (the API key
# is), so it is inlined here. HUMAN: confirm this id and the `production`
# parent-branch name once the unified project is provisioned; move to a secret
# (NEON_PROJECT_ID_MFR) if you prefer.
env:
  NEON_PROJECT_ID: lucky-butterfly-29223414
  NEON_PARENT_BRANCH: production

jobs:
  static:
    name: Format, lint, typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck

  unit:
    name: Unit tests + coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Fast unit signal for the app — its coverage (merged unit+integration)
      # and ratchet thresholds are enforced in the integration job below, which
      # has a database.
      - run: npm run test -w apps/mfr
      # Coverage + ratchet threshold enforcement for the no-DB packages.
      - run: npm run test:coverage -w packages/ui -w packages/auth
      - name: Coverage summary
        if: always()
        run: |
          echo "## Coverage — packages (lines / branches / functions)" >> "$GITHUB_STEP_SUMMARY"
          for f in packages/*/coverage/coverage-summary.json; do
            [ -f "$f" ] || continue
            ws=$(echo "$f" | cut -d/ -f1-2)
            jq -r --arg ws "$ws" \
              '"- **\($ws)**: \(.total.lines.pct)% / \(.total.branches.pct)% / \(.total.functions.pct)%"' \
              "$f" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-packages
          path: 'packages/*/coverage/coverage-summary.json'
          if-no-files-found: ignore

  build:
    name: Build apps/mfr
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Dummy value: several modules read DATABASE_URL at import time and throw
      # when unset, but postgres connects lazily so nothing dials out. If a build
      # ever tries to reach this, a page is statically prerendering a DB query
      # and should be marked dynamic instead.
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
      DIRECT_URL: postgres://ci:ci@localhost:5432/ci
      AUTH_SECRET: ci-dummy-secret-not-used
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build -w apps/mfr

  integration:
    name: Integration tests + coverage
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # The unified Neon project fits a limited number of ephemeral branches, so
    # DB-using jobs queue per job name across runs instead of failing branch
    # creation with 422.
    concurrency:
      group: neon-integration
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Create DB branch
        id: db
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          parent_branch: ${{ env.NEON_PARENT_BRANCH }}
          branch_name: ci-${{ github.run_id }}-${{ github.run_attempt }}-int
          api_key: ${{ secrets.NEON_API_KEY }}
      - name: Push Drizzle schema
        working-directory: apps/mfr
        env:
          DIRECT_URL: ${{ steps.db.outputs.db_url }}
        # db:push builds the schema from schema.ts; push-only.sql then adds the
        # objects drizzle-kit can't emit (GiST overlap EXCLUDE, booking_rules
        # CHECK, blocked-date triggers). psql ships on the ubuntu runner image.
        run: |
          npm run db:push
          psql "$DIRECT_URL" -f lib/db/push-only.sql
      # Merged unit+integration coverage; the ratchet thresholds in
      # vitest.config.ts are enforced here (exit 1 on regression).
      - name: Run tests with coverage
        env:
          TEST_DATABASE_URL: ${{ steps.db.outputs.db_url_pooled }}
          TEST_DIRECT_URL: ${{ steps.db.outputs.db_url }}
        run: npm run test:coverage -w apps/mfr
      - name: Coverage summary
        if: always()
        run: |
          f=apps/mfr/coverage/coverage-summary.json
          [ -f "$f" ] || exit 0
          echo "## Merged unit+integration coverage (lines / branches / functions)" >> "$GITHUB_STEP_SUMMARY"
          jq -r '"- \(.total.lines.pct)% / \(.total.branches.pct)% / \(.total.functions.pct)%"' "$f" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-mfr
          path: apps/mfr/coverage/coverage-summary.json
          if-no-files-found: ignore
      - name: Delete DB branch
        if: always()
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          branch: ci-${{ github.run_id }}-${{ github.run_attempt }}-int
          api_key: ${{ secrets.NEON_API_KEY }}

  e2e:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # See integration: serialize Neon-branch-using jobs across runs.
    concurrency:
      group: neon-e2e
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Create DB branch
        id: db
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          parent_branch: ${{ env.NEON_PARENT_BRANCH }}
          branch_name: ci-${{ github.run_id }}-${{ github.run_attempt }}-e2e
          api_key: ${{ secrets.NEON_API_KEY }}
      - name: Push Drizzle schema
        working-directory: apps/mfr
        env:
          DIRECT_URL: ${{ steps.db.outputs.db_url }}
        run: |
          npm run db:push
          psql "$DIRECT_URL" -f lib/db/push-only.sql
      - name: Build app
        env:
          # Dummy build-time env; the real branch URL is injected at runtime by
          # playwright.config.ts's webServer entry.
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
          DIRECT_URL: postgres://ci:ci@localhost:5432/ci
          AUTH_SECRET: ci-dummy-secret-not-used
        run: npm run build -w apps/mfr
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      # Single unified harness: one apps/mfr server on one origin, one Neon
      # branch. global-setup truncates/seeds via E2E_DIRECT_URL; the webServer
      # reads E2E_DATABASE_URL (pooled) as its runtime DATABASE_URL.
      - name: Run Playwright tests
        env:
          E2E_DATABASE_URL: ${{ steps.db.outputs.db_url_pooled }}
          E2E_DIRECT_URL: ${{ steps.db.outputs.db_url }}
        run: npm run e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
      - name: Delete DB branch
        if: always()
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          branch: ci-${{ github.run_id }}-${{ github.run_attempt }}-e2e
          api_key: ${{ secrets.NEON_API_KEY }}

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Run the gitleaks CLI directly rather than gitleaks-action: the action's
      # PR mode calls the GitHub API for the PR's commits, which the read-only
      # default token on a private repo rejects ("Resource not accessible by
      # integration"). The CLI scans local history with no API access and exits
      # non-zero on a real finding.
      - name: Install gitleaks
        run: curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | sudo tar -xz -C /usr/local/bin gitleaks
      - name: Scan git history
        run: gitleaks git . --redact --verbose

  # Static security analysis. CodeQL would be preferred but requires GitHub
  # Code Security (unavailable on this private repo's plan), so run semgrep's
  # open-source default ruleset instead. Advisory-only: findings appear in the
  # job log/summary without blocking merges.
  semgrep:
    name: Semgrep scan (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v7
      # Report findings without failing the job (advisory). No --error, so the
      # scan surfaces issues in the log without a red X on the check.
      - run: semgrep scan --config p/default --metrics=off

  audit:
    name: npm audit (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Audit high-severity vulnerabilities
        run: |
          echo "## npm audit (high+)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          npm audit --audit-level=high 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          npm audit --audit-level=high

  # The single required status check for branch protection. Everything except
  # the advisory-only jobs (`audit`, `semgrep`) must succeed.
  ci-ok:
    name: CI OK
    runs-on: ubuntu-latest
    needs: [static, unit, build, integration, e2e, gitleaks]
    if: always()
    steps:
      - name: Check all required jobs succeeded
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "job results: $results"
          for r in $results; do
            [ "$r" = "success" ] || { echo "a required job did not succeed"; exit 1; }
          done
