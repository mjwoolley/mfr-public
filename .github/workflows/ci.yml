# CI pipeline. Every job here must pass (except `semgrep`, which is
# advisory) before a PR can merge — branch protection requires the single
# `ci-ok` gate job, so job renames/additions only need the `needs` list below
# updated.
#
# Post single-app merge there is ONE app (apps/mfr) and ONE Neon database.
# Integration + e2e each run against their own ephemeral Neon branch created off
# the unified project's production branch; migrations are applied onto it
# (db:migrate + push-only.sql). Integration shards use separate database copies
# within ONE branch; the merge job deletes it after both shards finish.
# Branch creation waits for a free slot rather than queueing via GitHub
# `concurrency:` — see the long note on the `integration` job for why.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The unified Neon project ("mfr"). Project ids are not secrets (the API key
# is), so it is inlined here. HUMAN: confirm this id and the `production`
# parent-branch name once the unified project is provisioned; move to a secret
# (NEON_PROJECT_ID_MFR) if you prefer.
env:
  NEON_PROJECT_ID: lucky-butterfly-29223414
  NEON_PARENT_BRANCH: production

jobs:
  static:
    name: Format, lint, typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck

  schema-check:
    name: Schema migration check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Regenerate migrations from schema.ts; if anything changed, the PR edited
      # the schema without committing a migration. drizzle-kit generate needs no
      # DB (it diffs schema.ts against the committed snapshot in drizzle/meta).
      - name: Generate migrations from schema
        working-directory: apps/mfr
        # generate never connects — a dummy URL just satisfies the config guard.
        env:
          DIRECT_URL: postgresql://dummy:dummy@localhost:5432/dummy
        run: npm run db:generate
      - name: Fail if a migration is missing
        run: |
          if [ -n "$(git status --porcelain -- apps/mfr/drizzle)" ]; then
            echo "::error::schema.ts changed without a committed migration. Run 'npm run db:generate' on Node 22 and commit apps/mfr/drizzle/."
            git status --porcelain -- apps/mfr/drizzle
            git --no-pager diff -- apps/mfr/drizzle
            exit 1
          fi
          echo "schema.ts is in sync with committed migrations."

  unit:
    name: Unit tests + coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Fast unit signal for the app — its coverage (merged unit+integration)
      # and ratchet thresholds are enforced in the integration job below, which
      # has a database.
      - run: npm run test -w apps/mfr
      # Coverage + ratchet threshold enforcement for the no-DB packages.
      - run: npm run test:coverage -w packages/ui -w packages/auth
      # scripts/ is outside the workspaces, so `npm run test --workspaces` never
      # reaches it. Run its plain node:test suite explicitly — it covers the
      # post-deploy smoke's exit-code split and authorization layer, which drive
      # the production auto-rollback.
      - run: npm run test:smoke
      - name: Coverage summary
        if: always()
        run: |
          echo "## Coverage — packages (lines / branches / functions)" >> "$GITHUB_STEP_SUMMARY"
          for f in packages/*/coverage/coverage-summary.json; do
            [ -f "$f" ] || continue
            ws=$(echo "$f" | cut -d/ -f1-2)
            jq -r --arg ws "$ws" \
              '"- **\($ws)**: \(.total.lines.pct)% / \(.total.branches.pct)% / \(.total.functions.pct)%"' \
              "$f" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-packages
          path: 'packages/*/coverage/coverage-summary.json'
          if-no-files-found: ignore

  build:
    name: Build apps/mfr
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Dummy value: several modules read DATABASE_URL at import time and throw
      # when unset, but postgres connects lazily so nothing dials out. If a build
      # ever tries to reach this, a page is statically prerendering a DB query
      # and should be marked dynamic instead.
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
      DIRECT_URL: postgres://ci:ci@localhost:5432/ci
      AUTH_SECRET: ci-dummy-secret-not-used
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build -w apps/mfr

  integration-db:
    name: Prepare integration databases
    # Retry integration with "Re-run all jobs": cleanup removes the shared
    # branch even on failure, so rerunning only a shard cannot reuse it.
    runs-on: ubuntu-latest
    # Generous because the job may WAIT for a free Neon branch slot before it
    # starts (see "Create DB branch" below).
    timeout-minutes: 40
    # DELIBERATELY NO `concurrency:` HERE. This job used to carry a repo-global
    # group (`neon-integration`, cancel-in-progress: false) so DB jobs queued
    # instead of exhausting the Neon branch cap. That queue ate its own tail:
    # GitHub keeps only ONE pending job per concurrency group, so a third
    # overlapping run CANCELS whichever job is waiting — and
    # `cancel-in-progress: false` protects the running job, never the pending
    # one. Any burst of 3+ runs (i.e. every Dependabot batch) silently cancelled
    # the middle run's DB jobs and turned `ci-ok` red on an innocent PR.
    # Serialization now happens INSIDE the job instead, where waiting can't be
    # evicted. Do not reinstate this block.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Waits for a free branch slot instead of failing (or being cancelled)
      # when the project is at its branch cap; sets db_url / db_url_pooled.
      - name: Create DB branch
        id: db
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: node scripts/neon-ci-branch.mjs create ci-${{ github.run_id }}-${{ github.run_attempt }}-int
      - name: Apply Drizzle migrations
        working-directory: apps/mfr
        env:
          DIRECT_URL: ${{ steps.db.outputs.db_url }}
        # Same path as deploy: db:migrate applies pending migration files
        # (forward-only) then push-only.sql (GiST EXCLUDE / booking_rules CHECK /
        # blocked-date triggers drizzle-kit can't emit). The branch is forked from
        # `production` (baselined), so this exercises exactly what a deploy would.
        run: npm run db:migrate
      - name: Copy migrated production data into isolated shard databases
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: node scripts/neon-ci-branch.mjs clone-shards ci-${{ github.run_id }}-${{ github.run_attempt }}-int int_shard_1 int_shard_2

  integration-shard:
    name: Integration shard ${{ matrix.shard }}/2
    needs: integration-db
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Resolve credentials within each job, never through job outputs/artifacts.
      - name: Connect to shard database
        id: db
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: node scripts/neon-ci-branch.mjs connect ci-${{ github.run_id }}-${{ github.run_attempt }}-int int_shard_${{ matrix.shard }}
      - name: Run shard with coverage
        env:
          TEST_DATABASE_URL: ${{ steps.db.outputs.db_url_pooled }}
          TEST_DIRECT_URL: ${{ steps.db.outputs.db_url }}
          COVERAGE_SHARD: '1'
        working-directory: apps/mfr
        run: npx vitest run --coverage --shard=${{ matrix.shard }}/2 --reporter=default --reporter=blob
      - name: Redact database credentials from shard report
        id: redact
        if: always() && steps.db.outcome == 'success'
        env:
          TEST_DATABASE_URL: ${{ steps.db.outputs.db_url_pooled }}
          TEST_DIRECT_URL: ${{ steps.db.outputs.db_url }}
          REPORT_PATH: apps/mfr/.vitest-reports/blob-${{ matrix.shard }}-2.json
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs'
          const urls = [process.env.TEST_DATABASE_URL, process.env.TEST_DIRECT_URL]
          const secrets = urls.flatMap(url => [url, new URL(url).password, decodeURIComponent(new URL(url).password)])
          let report = fs.readFileSync(process.env.REPORT_PATH, 'utf8')
          for (const secret of [...new Set(secrets)].filter(Boolean).sort((a, b) => b.length - a.length)) {
            report = report.replaceAll(JSON.stringify(secret).slice(1, -1), '[REDACTED]')
          }
          JSON.parse(report)
          fs.writeFileSync(process.env.REPORT_PATH, report)
          JS
      - name: Upload shard report
        if: always() && steps.redact.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: integration-blob-${{ matrix.shard }}
          path: apps/mfr/.vitest-reports/blob-${{ matrix.shard }}-2.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  integration:
    name: Integration tests + coverage
    needs: [integration-db, integration-shard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Require successful provisioning and both shards
        env:
          DB_RESULT: ${{ needs.integration-db.result }}
          SHARD_RESULT: ${{ needs.integration-shard.result }}
        run: test "$DB_RESULT" = success && test "$SHARD_RESULT" = success
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          pattern: integration-blob-*
          merge-multiple: true
          path: apps/mfr/.vitest-reports
      - name: Merge unit and integration coverage and enforce original thresholds
        working-directory: apps/mfr
        run: |
          test -s .vitest-reports/blob-1-2.json
          test -s .vitest-reports/blob-2-2.json
          npx vitest run --merge-reports --coverage
      - name: Coverage summary
        if: always()
        run: |
          f=apps/mfr/coverage/coverage-summary.json
          [ -f "$f" ] || exit 0
          echo "## Merged unit+integration coverage (lines / branches / functions)" >> "$GITHUB_STEP_SUMMARY"
          jq -r '"- \(.total.lines.pct)% / \(.total.branches.pct)% / \(.total.functions.pct)%"' "$f" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-mfr
          path: apps/mfr/coverage/coverage-summary.json
          if-no-files-found: ignore
      - name: Delete DB branch
        if: always()
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: node scripts/neon-ci-branch.mjs delete ci-${{ github.run_id }}-${{ github.run_attempt }}-int

  e2e:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    # See integration: may wait for a Neon branch slot on top of its own runtime.
    timeout-minutes: 40
    # See integration: NO `concurrency:` block on purpose — a pending job in a
    # concurrency group gets cancelled by the next arrival, which is exactly the
    # failure this replaced. The wait happens inside "Create DB branch".
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Create DB branch
        id: db
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: node scripts/neon-ci-branch.mjs create ci-${{ github.run_id }}-${{ github.run_attempt }}-e2e
      - name: Apply Drizzle migrations
        working-directory: apps/mfr
        env:
          DIRECT_URL: ${{ steps.db.outputs.db_url }}
        run: npm run db:migrate
      - name: Build app
        env:
          # Dummy build-time env; the real branch URL is injected at runtime by
          # playwright.config.ts's webServer entry.
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
          DIRECT_URL: postgres://ci:ci@localhost:5432/ci
          AUTH_SECRET: ci-dummy-secret-not-used
        run: npm run build -w apps/mfr
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      # Single unified harness: one apps/mfr server on one origin, one Neon
      # branch. global-setup truncates/seeds via E2E_DIRECT_URL; the webServer
      # reads E2E_DATABASE_URL (pooled) as its runtime DATABASE_URL.
      - name: Run Playwright tests
        env:
          E2E_DATABASE_URL: ${{ steps.db.outputs.db_url_pooled }}
          E2E_DIRECT_URL: ${{ steps.db.outputs.db_url }}
        run: npm run e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
      - name: Delete DB branch
        if: always()
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: node scripts/neon-ci-branch.mjs delete ci-${{ github.run_id }}-${{ github.run_attempt }}-e2e

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Run the gitleaks CLI directly rather than gitleaks-action: the action's
      # PR mode calls the GitHub API for the PR's commits, which the read-only
      # default token on a private repo rejects ("Resource not accessible by
      # integration"). The CLI scans local history with no API access and exits
      # non-zero on a real finding.
      - name: Install gitleaks
        run: curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | sudo tar -xz -C /usr/local/bin gitleaks
      - name: Scan git history
        run: gitleaks git . --redact --verbose

  # Static security analysis. CodeQL would be preferred but requires GitHub
  # Code Security (unavailable on this private repo's plan), so run semgrep's
  # open-source default ruleset instead. Advisory-only: findings appear in the
  # job log/summary without blocking merges.
  semgrep:
    name: Semgrep scan (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v7
      # Report findings without failing the job (advisory). No --error, so the
      # scan surfaces issues in the log without a red X on the check.
      - run: semgrep scan --config p/default --metrics=off

  # There is deliberately no `npm audit` job. It was advisory-only and went red
  # on every PR for advisories nobody could act on — every one of them pinned by
  # a parent we don't control (postcss by next, brace-expansion by eslint's
  # minimatch, esbuild by drizzle-kit, qs by stryker), and none reaching the
  # served app. A check that is permanently red teaches you to ignore red, which
  # is worse than no check. Dependabot alerts are the backstop; see
  # docs/backlog.md for the standing triage of what's parked and why.

  # The single required status check for branch protection. Everything except
  # the advisory-only `semgrep` job must succeed.
  ci-ok:
    name: CI OK
    runs-on: ubuntu-latest
    needs: [static, schema-check, unit, build, integration, e2e, gitleaks]
    if: always()
    steps:
      - name: Check all required jobs succeeded
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "job results: $results"
          for r in $results; do
            [ "$r" = "success" ] || { echo "a required job did not succeed"; exit 1; }
          done
