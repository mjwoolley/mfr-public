# Staging gate — enforces docs/workflow.md §6 ("test on staging before merging").
#
# A PR to `main` cannot merge until the branch has been deployed to `staging` and
# staging's post-deploy smoke passed. We express that as a `staging-verified`
# commit status on the PR head; Mike adds it to `main`'s required status checks
# (server-side, after this workflow's first run so the context appears in the
# picker). Two triggers drive it:
#
#   1. pull_request → set `staging-verified` = PENDING on the PR head ("merge into
#      staging and let its smoke pass"). A `skip-staging` label short-circuits to
#      SUCCESS for PRs with no runtime surface (docs / CI config), which §6 exempts.
#   2. workflow_run (Post-deploy smoke completed) → if that run smoked a STAGING
#      deploy, flip `staging-verified` to SUCCESS/FAILURE on every open PR whose
#      head is now contained in that staging commit.
#
# `pull_request` and `workflow_run` are both non-fork-privileged / default-branch
# triggers, so — like post-deploy-smoke — this only takes effect once on `main`.
name: Staging gate

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches: [main]
  workflow_run:
    workflows: ['Post-deploy smoke']
    types: [completed]

# statuses: write the `staging-verified` context · pulls read: enumerate open PRs.
permissions:
  statuses: write
  pull-requests: read
  contents: read

concurrency:
  group: staging-gate-${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  # ── On PR events: mark the head pending (or success if the PR opts out) ──────
  pending:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request
            const skip = pr.labels.some((l) => l.name === 'skip-staging')
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: pr.head.sha,
              context: 'staging-verified',
              state: skip ? 'success' : 'pending',
              description: skip
                ? 'skip-staging: no runtime surface'
                : 'Merge this branch into `staging` and let its smoke pass',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/blob/main/docs/workflow.md`,
            })

  # ── On a completed Post-deploy smoke: resolve the gate for matching PRs ──────
  resolve:
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run
            const sha = run.head_sha

            // true iff `ancestor` is an ancestor of (or equal to) `descendant`.
            const isAncestor = async (ancestor, descendant) => {
              if (ancestor === descendant) return true
              const { data } = await github.rest.repos.compareCommits({
                ...context.repo, base: ancestor, head: descendant,
              })
              return data.status === 'ahead' || data.status === 'identical'
            }

            const tip = async (branch) =>
              (await github.rest.repos.getBranch({ ...context.repo, branch })).data.commit.sha
            const stagingTip = await tip('staging')
            const mainTip = await tip('main')

            // Only act on STAGING deploys: the smoked commit must live on the
            // staging branch and NOT already be on main (a main→staging re-sync
            // or a prod deploy is handled by its own prod smoke, not the gate).
            const onStaging = await isAncestor(sha, stagingTip)
            const onMain = await isAncestor(sha, mainTip)
            if (!onStaging || onMain) {
              core.info(`Smoke @ ${sha.slice(0, 7)} is not a staging-only deploy (onStaging=${onStaging}, onMain=${onMain}) — nothing to gate.`)
              return
            }

            const ok = run.conclusion === 'success'
            const state = ok ? 'success' : 'failure'
            const description = ok
              ? 'Staging smoke passed'
              : 'Staging smoke failed — fix and re-deploy to staging'

            // Every open PR to main whose head is contained in the smoked commit
            // has been exercised on staging → resolve its gate.
            const prs = await github.paginate(github.rest.pulls.list, {
              ...context.repo, state: 'open', base: 'main', per_page: 100,
            })
            let updated = 0
            for (const pr of prs) {
              if (!(await isAncestor(pr.head.sha, sha))) continue
              await github.rest.repos.createCommitStatus({
                ...context.repo,
                sha: pr.head.sha,
                context: 'staging-verified',
                state,
                description,
                target_url: run.html_url,
              })
              core.info(`PR #${pr.number}: staging-verified → ${state}`)
              updated++
            }
            core.info(`Resolved ${updated} PR(s) from staging smoke @ ${sha.slice(0, 7)} (${state}).`)
