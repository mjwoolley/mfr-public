# Weekly dependency update PRs. npm workspaces are handled from the root
# lockfile; minor+patch updates are grouped into one PR to keep noise down
# (majors stay separate so breaking changes get individual attention).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
